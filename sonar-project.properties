# SonarQube Cloud settings (read by the "Code quality" job in .github/workflows/pipeline.yaml).
# organization / projectKey: as shown in SonarQube Cloud after importing the repository
# (defaults when importing GitHub org "AjinOrg": organization "ajinorg", project key "AjinOrg_my-app").
sonar.organization=ajinorg
sonar.projectKey=AjinOrg_my-app
sonar.projectName=my-app

sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Coverage from `npm run test:coverage` (Node's built-in lcov reporter)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# server.js only starts the HTTP server and handles signals; the logic in app.js is fully unit-tested
sonar.coverage.exclusions=src/server.js
