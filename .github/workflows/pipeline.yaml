# my-app pipeline
#   Pull request → ALL checks (no AWS access): secrets, lint + tests + coverage, SonarQube Cloud quality gate,
#                  dependencies, filesystem scan, image build + Trivy, Kyverno policies against the platform's chart.
#                  The ruleset requires the branch to be up to date with main, so the checked code is exactly
#                  what main becomes.
#   Push to main → lighter run: build, Trivy image (a CVE may have been published since the PR), Kyverno, push to
#                  ECR (GitHub OIDC, no keys), then a deployment pull request in AjinOrg/aws-platform
#                  (values-dev.yaml image.tag = commit SHA) that merges itself once platform-ci passes.
#   Staging/production: released on purpose (aws-platform release.yaml).
# Any failing check stops everything after it: a vulnerable or non-compliant image never reaches ECR.
name: my-app

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: 471112815218.dkr.ecr.ap-south-1.amazonaws.com/my-app
  ECR_PUSH_ROLE: arn:aws:iam::471112815218:role/aws-platform-ecr-push # trusts only this repo's main branch
  PLATFORM_OWNER: AjinOrg
  PLATFORM_REPO: aws-platform
  HELM_VERSION: v4.3.0
  DEPENDENCY_CHECK_VERSION: "13.0.0"

jobs:
  gitleaks:
    name: Secrets scan (Gitleaks)
    if: github.event_name == 'pull_request' # checks run on PRs (branch must be up to date with main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/install-ci-tools.sh gitleaks
      - run: gitleaks git --redact --verbose .

  lint-test:
    name: Lint + unit tests
    if: github.event_name == 'pull_request' # checks run on PRs (branch must be up to date with main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  sonar:
    name: Code quality (SonarQube Cloud)
    if: github.event_name == 'pull_request' # checks run on PRs (branch must be up to date with main)
    needs: lint-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: Sonar tells new code from old code (blame)
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: SonarQube Cloud scan + quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: SonarQube Cloud skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN secret not set - SonarQube Cloud analysis skipped."

  dependency-check:
    name: Dependencies (npm audit + OWASP Dependency-Check)
    if: github.event_name == 'pull_request' # checks run on PRs (branch must be up to date with main)
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: npm audit (high and critical fail)
        run: npm audit --audit-level=high
      - name: OWASP Dependency-Check database cache
        if: env.NVD_API_KEY != ''
        uses: actions/cache@v4
        with:
          path: ~/.odc-data
          key: odc-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ github.run_id }}
          restore-keys: odc-${{ env.DEPENDENCY_CHECK_VERSION }}-
      - name: OWASP Dependency-Check (CVSS >= 7 fails)
        if: env.NVD_API_KEY != ''
        run: |
          mkdir -p ~/.odc-data odc-report
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/src -v "$HOME/.odc-data":/usr/share/dependency-check/data -v "$PWD/odc-report":/report \
            -e NVD_API_KEY \
            "owasp/dependency-check:${DEPENDENCY_CHECK_VERSION}" \
            --scan /src --exclude "/src/odc-report/**" --project my-app \
            --format HTML --format JSON --out /report \
            --failOnCVSS 7 --nvdApiKey "$NVD_API_KEY" --disableYarnAudit --disablePnpmAudit
      - name: OWASP Dependency-Check skipped
        if: env.NVD_API_KEY == ''
        run: echo "::warning::NVD_API_KEY secret not set - OWASP Dependency-Check skipped (npm audit still ran). Add the secret to enable it."
      - if: always() && env.NVD_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: odc-report/
          if-no-files-found: ignore

  trivy-fs:
    name: Filesystem scan (Trivy)
    if: github.event_name == 'pull_request' # checks run on PRs (branch must be up to date with main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/install-ci-tools.sh trivy
      - name: vulnerabilities, secrets and Dockerfile misconfigurations
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  image:
    name: Build image + Trivy + Kyverno (+ push on main)
    needs: [gitleaks, lint-test, sonar, dependency-check, trivy-fs]
    # PR: all checks must succeed. main: the checks are skipped (they passed on the up-to-date PR), so run unless
    # a needed job failed or was cancelled
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job request a GitHub OIDC token for AWS (used only on main)
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - run: bash .github/scripts/install-ci-tools.sh trivy kyverno
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: build
        run: docker build -t "$ECR_REPOSITORY:${{ steps.meta.outputs.tag }}" .

      - name: Trivy image scan (HIGH/CRITICAL with a fix available fail)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$ECR_REPOSITORY:${{ steps.meta.outputs.tag }}"

      # The same policies the cluster enforces, applied to the platform's chart with THIS image
      - name: checkout platform policies and chart
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_OWNER }}/${{ env.PLATFORM_REPO }}
          path: platform
      - name: Kyverno policies
        run: |
          for env in dev staging production; do
            helm template my-app platform/helm/my-app -n "$env" \
              -f "platform/gitops/apps/my-app/values-$env.yaml" \
              --set image.tag="${{ steps.meta.outputs.tag }}" > "rendered-$env.yaml"
            kyverno apply platform/policies/kyverno --resource "rendered-$env.yaml"
          done

      # ---- main only: publish
      - name: AWS credentials (GitHub OIDC → role aws-platform-ecr-push, 1 hour)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: push to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%/*}"
          # Tags are immutable: a re-run for the same commit must not fail
          if aws ecr describe-images --repository-name my-app --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG already in ECR - not pushed again"
          else
            docker push "$ECR_REPOSITORY:$TAG"
          fi
          echo "### Image pushed: \`$ECR_REPOSITORY:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deployment pull request (dev)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deployment PR at a time: later pushes wait, and the newest tag wins (older open PRs are closed)
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: GitHub App configured?
        if: vars.PLATFORM_APP_ID == ''
        run: |
          echo "::warning::GitHub App not configured (variable PLATFORM_APP_ID, secret PLATFORM_APP_PRIVATE_KEY)."
          echo "Deploy by hand: set image.tag to ${{ needs.image.outputs.tag }} in gitops/apps/my-app/values-dev.yaml of $PLATFORM_OWNER/$PLATFORM_REPO" >> "$GITHUB_STEP_SUMMARY"

      # Short-lived (1 hour) token of a GitHub App that may only write to aws-platform: no personal token stored.
      # PRs opened with it also trigger platform-ci (PRs opened with GITHUB_TOKEN would not).
      - id: app-token
        if: vars.PLATFORM_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ env.PLATFORM_OWNER }}
          repositories: ${{ env.PLATFORM_REPO }}

      - if: vars.PLATFORM_APP_ID != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_OWNER }}/${{ env.PLATFORM_REPO }}
          token: ${{ steps.app-token.outputs.token }}

      - name: open the dev pull request (merges itself when platform-ci passes; no approval needed for dev)
        if: vars.PLATFORM_APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          FILE=gitops/apps/my-app/values-dev.yaml
          BRANCH="deploy/dev/my-app-$TAG"
          REPO="$PLATFORM_OWNER/$PLATFORM_REPO"

          # Newest tag wins: close dev deployment PRs that are still open for older tags
          for old in $(gh pr list -R "$REPO" --state open --json headRefName \
                         --jq '.[].headRefName | select(startswith("deploy/dev/my-app-"))'); do
            [ "$old" = "$BRANCH" ] && continue
            gh pr close "$old" -R "$REPO" --delete-branch --comment "Superseded by my-app $TAG"
          done

          sed -i -E "s/^(  tag: ).*/\1\"$TAG\"/" "$FILE"
          if git diff --quiet; then echo "dev already runs $TAG"; exit 0; fi
          # Commit as the GitHub App's own bot account, so every commit is attributed to the app
          SLUG="${{ steps.app-token.outputs.app-slug }}"
          BOT_ID=$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "deploy(dev): my-app $TAG"
          git push --force origin "$BRANCH"
          gh pr create -R "$REPO" --base main --head "$BRANCH" \
            --title "deploy(dev): my-app $TAG" \
            --body "Automatic dev deployment of \`$ECR_REPOSITORY:$TAG\`.
          Checks passed in my-app: Gitleaks, tests, SonarQube Cloud, dependencies, Trivy (fs + image), Kyverno.
          Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          Merges itself when platform-ci passes. After the sync, verify.yaml smoke-tests dev. Staging is released on purpose (release.yaml)."
          gh pr merge "$BRANCH" -R "$REPO" --auto --squash --delete-branch
          echo "### Dev deployment PR opened for \`$TAG\` (auto-merge)" >> "$GITHUB_STEP_SUMMARY"
